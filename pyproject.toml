[project]
name = "printer-agent"
version = "0.1.0"
description = "Lightweight local agent that monitors 3D prints through a camera, detects failures, and alerts you wherever you are."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Arnaldo Lopes" }]
keywords = ["3d-printing", "klipper", "moonraker", "octoprint", "monitoring", "computer-vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[project.scripts]
printer-agent = "agent.__main__:main"

[project.urls]
Homepage = "https://github.com/arnaldoliro/printer-agent"
Repository = "https://github.com/arnaldoliro/printer-agent"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

# ---------------------------------------------------------------------------
# ruff: lint + format (replaces black, flake8 and isort)
# target-version stays at py310 so we never ship syntax that breaks on the
# older Pythons found on embedded printer boards.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
